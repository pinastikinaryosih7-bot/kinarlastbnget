<!DOCTYPE html>
<html lang="en">
<head>
	<title>Register Account</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->	
	<link rel="icon" type="image/png" href="images/icons/favicon.ico"/>
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="vendor/animate/animate.css">
<!--===============================================================================================-->	
	<link rel="stylesheet" type="text/css" href="vendor/css-hamburgers/hamburgers.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="vendor/select2/select2.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="./css/util.css">
	<link rel="stylesheet" type="text/css" href="./css/main.css">
<!--===============================================================================================-->
	<style>
		/* Efek transisi pas tombol disentuh mouse */
		.btn-custom-action:hover {
			background-color: #cccccc !important;
			transform: scale(1.02);
			transition: all 0.2s ease-in-out;
		}
		.btn-home-action:hover {
			background-color: #f2f2f2 !important;
			transform: scale(1.02);
			transition: all 0.2s ease-in-out;
		}
	</style>
</head>
<body>
	
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<!-- Gambar selamat datang di sebelah kiri -->
				<div class="login100-pic js-tilt" data-tilt>
					<img src="./image/selamatdtang.png" alt="IMG">
				</div>

				<!-- ID FORM DIGANTI MENJADI registerForm SESUAI LKPD -->
				<form class="login100-form validate-form" id="registerForm">
					<span class="login100-form-title">
						Register Account
					</span>

					<!-- INPUT 1: NAMA PENGGUNA / USERNAME -->
					<div class="wrap-input100 validate-input" data-validate = "Username is required">
						<input class="input100" type="text" id="username" name="username" placeholder="Nama Pengguna" required>
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-user" aria-hidden="true"></i>
						</span>
					</div>

					<!-- INPUT 2: EMAIL (TAMBAHAN KHUSUS UNTUK REGISTER) -->
					<div class="wrap-input100 validate-input" data-validate = "Valid email is required: ex@abc.xyz">
						<input class="input100" type="email" id="email" name="email" placeholder="Email Anda" required>
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-envelope" aria-hidden="true"></i>
						</span>
					</div>

					<!-- INPUT 3: PASSWORD -->
					<div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" id="password" name="pass" placeholder="Password Baru Anda" required>
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>
					
					<!-- TOMBOL UTAMA: DAFTAR -->
					<div class="container-login100-form-btn">
						<button class="login100-form-btn" type="submit">
							Daftar
						</button>
					</div>

					<!-- TOMBOL TAMBAHAN BERJEJER: LOGIN (KEMBALI) & GOOGLE -->
					<div class="p-t-15 p-b-10" style="display: flex; gap: 10px; width: 100%;">
						<!-- Pindah ke Login Kembali -->
						<a href="login.html" class="txt2 text-center p-t-12 p-b-12 btn-custom-action" style="background: #e6e6e6; color: #333333; font-weight: bold; border-radius: 25px; flex: 1; display: block; text-decoration: none;">
							LOGIN
						</a>
						<!-- Tombol Google Interaktif -->
						<button type="button" onclick="aksiTombolGoogleRegister()" class="txt2 text-center p-t-12 p-b-12 btn-custom-action" style="background: #e6e6e6; color: #333333; font-weight: bold; border-radius: 25px; flex: 1; border: none; cursor: pointer;">
							<i class="fa fa-google" aria-hidden="true"></i> Google
						</button>
					</div>

					<!-- TOMBOL HOME PUTIH PANJANG BIAR NAVIGASI AMAN -->
					<div class="w-100 p-t-5">
						<button class="text-center p-t-12 p-b-12 w-100 btn-home-action" type="button" onclick="location.href='../index.html';" style="background: #ffffff; color: #333333; font-weight: bold; border-radius: 25px; border: 1px solid #e6e6e6; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
							Home
						</button>
					</div>

					<!-- WADAH NOTIFIKASI HIJAU DI PALING BAWAH (SAMA SEPERTI DI LOGIN) -->
					<div id="alertBox" class="alert" style="display:none; color: green; text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px;"></div>
					<p id="message"></p>
				</form>
			</div>
		</div>
	</div>
	
<!--===============================================================================================-->	
	<script src="vendor/jquery/jquery-3.2.1.min.js"></script>
<!--===============================================================================================-->
	<script src="vendor/bootstrap/js/popper.js"></script>
	<script src="vendor/bootstrap/js/bootstrap.min.js"></script>
<!--===============================================================================================-->
	<script src="vendor/select2/select2.min.js"></script>
<!--===============================================================================================-->
	<script src="vendor/tilt/tilt.jquery.min.js"></script>
	<script >
		$('.js-tilt').tilt({
			scale: 1.1
		})
	</script>

	<!-- SCRIPT UNTUK AKSI INTERAKSI GOOGLE REGISTER -->
	<script>
		function aksiTombolGoogleRegister() {
			var alertBox = document.getElementById('alertBox');
			alertBox.style.display = 'block';
			alertBox.style.color = 'green';
			alertBox.innerHTML = 'Menghubungkan ke Google...';
		}
	</script>

<!--===============================================================================================-->
	<script src="js/main.js"></script>
	
	<!-- SKRIP UTAMA DIUBAH UNTUK MEMANGGIL SCRIPT REGISTER DENGAN DEFER -->
	<script src="js/register.js" defer></script>
</body>
</html>
