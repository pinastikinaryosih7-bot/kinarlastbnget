<!DOCTYPE html>
<html lang="en">
<head>
	<title>Silahkan Login</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->	
	<link rel="icon" type="image/png" href="images/icons/favicon.ico"/>
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="vendor/animate/animate.css">
<!--===============================================================================================-->	
	<link rel="stylesheet" type="text/css" href="vendor/css-hamburgers/hamburgers.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="vendor/select2/select2.min.css">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="./css/util.css">
	<link rel="stylesheet" type="text/css" href="./css/main.css">
<!--===============================================================================================-->
</head>
<body>
	
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<!-- Gambar selamat datang di sebelah kiri -->
				<div class="login100-pic js-tilt" data-tilt>
					<img src="./image/selamatdtang.png" alt="IMG">
				</div>

				<!-- FORM UTAMA DENGAN id="loginForm" SESUAI LKPD -->
				<form class="login100-form validate-form" id="loginForm">
					<span class="login100-form-title">
						Silahkan Login
					</span>

					<!-- INPUT NAMA PENGGUNA / USERNAME -->
					<div class="wrap-input100 validate-input" data-validate = "Valid username is required">
						<input class="input100" type="text" id="username" name="email" placeholder="Nama Pengguna.." required>
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-user" aria-hidden="true"></i>
						</span>
					</div>

					<!-- INPUT PASSWORD -->
					<div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" id="password" name="pass" placeholder="Password.." required>
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>
					
					<!-- 1. TOMBOL UTAMA UNTUK MASUK (HURUF KECIL SESUAI LKPD) -->
					<div class="container-login100-form-btn">
						<button class="login100-form-btn" type="submit">
							masuk
						</button>
					</div>

					<!-- 2. TOMBOL DAFTAR & GOOGLE BERJEJER DI TENGAH (BARIS 30-32 LKPD) -->
					<div class="p-t-15 p-b-10" style="display: flex; gap: 10px; width: 100%;">
						<!-- Tombol Daftar (Abu-abu) -->
						<a href="register.html" class="txt2 text-center p-t-12 p-b-12" style="background: #e6e6e6; color: #333333; font-weight: bold; border-radius: 25px; flex: 1; display: block; text-decoration: none;">
							DAFTAR
						</a>
						<!-- Tombol Google (Abu-abu) -->
						<div class="txt2 text-center p-t-12 p-b-12" style="background: #e6e6e6; color: #333333; border-radius: 25px; flex: 1;">
							<i class="fa fa-google" aria-hidden="true"></i> Google
						</div>
					</div>

					<!-- 3. TOMBOL HOME PUTIH PANJANG (BARIS 34 LKPD) -->
					<div class="w-100 p-t-5">
						<button class="text-center p-t-12 p-b-12 w-100" type="button" onclick="location.href='../index.html';" style="background: #ffffff; color: #333333; font-weight: bold; border-radius: 25px; border: 1px solid #e6e6e6; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
							Home
						</button>
					</div>

					<!-- WADAH PESAN ERROR UNTUK NOTIFIKASI JIKALAU LOGIN GAGAL -->
					<div id="alertBox" class="alert" style="display:none; color: red; text-align: center; margin-top: 10px; font-weight: bold; font-size: 14px;"></div>
				</form>
			</div>
		</div>
	</div>
	
<!--===============================================================================================-->	
	<script src="vendor/jquery/jquery-3.2.1.min.js"></script>
<!--===============================================================================================-->
	<script src="vendor/bootstrap/js/popper.js"></script>
	<script src="vendor/bootstrap/js/bootstrap.min.js"></script>
<!--===============================================================================================-->
	<script src="vendor/select2/select2.min.js"></script>
<!--===============================================================================================-->
	<script src="vendor/tilt/tilt.jquery.min.js"></script>
	<script >
		$('.js-tilt').tilt({
			scale: 1.1
		})
	</script>
<!--===============================================================================================-->
	<script src="js/main.js"></script>
	<!-- LOGIKA LOGIN KAMU DIPANGGIL DI SINI -->
	<script src="js/login.js"></script>
</body>
</html>
